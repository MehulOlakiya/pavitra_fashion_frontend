<div class="dp-wrap">
  <!-- Trigger -->
  <div
    class="dp-input-group"
    [class.dp-input-group--invalid]="invalid"
    (click)="toggle()"
  >
    <span class="material-symbols-outlined dp-icon">calendar_month</span>
    <span class="dp-value" [class.dp-value--placeholder]="!value">
      {{ value ? displayValue : placeholder }}
    </span>
    <span
      class="material-symbols-outlined dp-clear"
      *ngIf="value"
      (click)="clear($event)"
      >close</span
    >
    <span
      class="material-symbols-outlined dp-chevron"
      [class.dp-chevron--open]="isOpen"
    >
      expand_more
    </span>
  </div>

  <!-- Calendar Popover -->
  <div class="dp-popover" *ngIf="isOpen" (click)="$event.stopPropagation()">
    <!-- Header -->
    <div class="dp-header">
      <select
        class="dp-select"
        [value]="viewMonth"
        (change)="onMonthChange($any($event.target).value)"
      >
        <option *ngFor="let m of monthNames; let i = index" [value]="i">
          {{ m }}
        </option>
      </select>
      <select
        class="dp-select dp-select--year"
        [value]="viewYear"
        (change)="onYearChange($any($event.target).value)"
      >
        <option *ngFor="let y of years" [value]="y">{{ y }}</option>
      </select>
      <button class="dp-nav" type="button" (click)="prevMonth()">
        &#8249;
      </button>
      <button class="dp-nav" type="button" (click)="nextMonth()">
        &#8250;
      </button>
    </div>

    <!-- Day headers -->
    <div class="dp-day-headers">
      <span *ngFor="let d of dayHeaders">{{ d }}</span>
    </div>

    <!-- Calendar grid -->
    <div class="dp-grid">
      <button
        *ngFor="let day of calendarDays"
        class="dp-day"
        type="button"
        [class.dp-day--other]="!isCurrentMonth(day)"
        [class.dp-day--today]="isToday(day)"
        [class.dp-day--selected]="isSelected(day)"
        [class.dp-day--disabled]="isDisabled(day)"
        (click)="selectDate(day)"
      >
        {{ day.getDate() }}
      </button>
    </div>

    <!-- Footer -->
    <div class="dp-footer">
      <button class="dp-btn dp-btn--clear" type="button" (click)="clear()">
        Clear
      </button>
      <button class="dp-btn dp-btn--close" type="button" (click)="close()">
        Close
      </button>
    </div>
  </div>
</div>
