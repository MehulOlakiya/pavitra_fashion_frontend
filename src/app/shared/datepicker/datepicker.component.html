<div class="dp-wrap">

  <!-- Trigger — clicking anywhere here opens the calendar -->
  <div
    #triggerEl
    class="dp-trigger"
    [class.dp-trigger--active]="isOpen"
    [class.dp-trigger--invalid]="invalid"
    (click)="toggle()"
  >
    <span class="material-symbols-outlined dp-cal-icon">calendar_month</span>
    <span class="dp-display" [class.dp-display--placeholder]="!value">
      {{ value ? displayValue : placeholder }}
    </span>
    @if (value) {
      <span
        class="material-symbols-outlined dp-clear-icon"
        (click)="clear($event)"
      >close</span>
    }
    <span
      class="material-symbols-outlined dp-chevron"
      [class.dp-chevron--open]="isOpen"
    >expand_more</span>
  </div>

  <!-- Calendar Popup — fixed-positioned to escape any overflow container -->
  @if (isOpen) {
    <div
      class="dp-popup"
      [style.top]="popupTop"
      [style.left]="popupLeft"
      [style.width]="popupWidth"
      (click)="$event.stopPropagation()"
    >

      <!-- Year selector + nav -->
      <div class="dp-top-row">
        <div class="dp-year-wrap">
          <select
            class="dp-year-select"
            [value]="viewYear"
            (change)="onYearChange($any($event.target).value)"
          >
            @for (y of years; track y) {
              <option [value]="y" [selected]="y === viewYear">{{ y }}</option>
            }
          </select>
          <span class="material-symbols-outlined dp-year-arrow">keyboard_arrow_down</span>
        </div>
        <div class="dp-nav-wrap">
          <button type="button" class="dp-nav-btn" (click)="prevMonth()">
            <span class="material-symbols-outlined">chevron_left</span>
          </button>
          <button type="button" class="dp-nav-btn" (click)="nextMonth()">
            <span class="material-symbols-outlined">chevron_right</span>
          </button>
        </div>
      </div>

      <!-- Month label -->
      <div class="dp-month-label">{{ monthNames[viewMonth].toUpperCase() }}</div>

      <!-- Day-of-week headers -->
      <div class="dp-day-headers">
        @for (h of dayHeaders; track h) {
          <span class="dp-day-header">{{ h }}</span>
        }
      </div>

      <!-- Calendar grid -->
      <div class="dp-grid">
        @for (day of calendarDays; track $index) {
          <button
            type="button"
            class="dp-day-btn"
            [class.dp-day--other]="!isCurrentMonth(day)"
            [class.dp-day--today]="isToday(day)"
            [class.dp-day--selected]="isSelected(day)"
            [class.dp-day--disabled]="isDisabled(day)"
            (click)="selectDate(day)"
          >{{ day.getDate() }}</button>
        }
      </div>

    </div>
  }

</div>
