<div class="page">
  <!-- Page Header -->
  <div class="page-header">
    <div class="page-header__left">
      <div class="breadcrumb">
        <a routerLink="/bookings" class="breadcrumb__link">Bookings</a>
        <span class="material-symbols-outlined breadcrumb__sep"
          >chevron_right</span
        >
        <span class="breadcrumb__current">Edit Booking</span>
      </div>
      <h2 class="page-title">Edit Booking</h2>
    </div>
  </div>

  @if (loading) {
    <div class="loading-state">
      <span class="material-symbols-outlined spinning">progress_activity</span>
      <p>Loading booking details…</p>
    </div>
  } @else {
    <div class="form-grid">
      <!-- ── Left column ─────────────────────────────────── -->
      <div class="col-main">
        <!-- Rental Schedule -->
        <div class="card">
          <div class="card__accent"></div>
          <h3 class="card__title">Rental Schedule</h3>
          <div class="card__body">
            <div class="date-grid">
              <div class="date-field">
                <label class="field__label"
                  >BOOKING DATE <span class="required">*</span></label
                >
                <app-datepicker
                  placeholder="DD / MM / YYYY"
                  [value]="bookingDate"
                  [invalid]="submitted && !bookingDate"
                  [minDate]="today"
                  (valueChange)="bookingDate = $event"
                />
              </div>
              <div class="date-arrow">
                <span class="material-symbols-outlined">arrow_forward</span>
              </div>
              <div class="date-field">
                <label class="field__label"
                  >RETURN DATE <span class="required">*</span></label
                >
                <app-datepicker
                  placeholder="DD / MM / YYYY"
                  [value]="returnDate"
                  [invalid]="submitted && !returnDate"
                  [minDate]="bookingDate ?? today"
                  (valueChange)="returnDate = $event"
                />
              </div>
            </div>
          </div>
        </div>

        <!-- Customer Information -->
        <div class="card">
          <div class="card__accent"></div>
          <h3 class="card__title">Customer Information</h3>
          <div class="card__body">
            <div class="field">
              <label class="field__label"
                >FULL NAME <span class="required">*</span></label
              >
              <input
                class="field__input"
                type="text"
                placeholder="Customer full name"
                [(ngModel)]="form.customerName"
                name="customerName"
                [class.is-invalid]="submitted && !form.customerName"
              />
            </div>
            <div class="field-row">
              <div class="field">
                <label class="field__label"
                  >MOBILE NUMBER <span class="required">*</span></label
                >
                <input
                  class="field__input"
                  type="tel"
                  placeholder="Phone number"
                  [(ngModel)]="form.customerPhone"
                  name="customerPhone"
                  [class.is-invalid]="submitted && !form.customerPhone"
                />
              </div>
              <div class="field">
                <label class="field__label"
                  >VILLAGE / CITY <span class="required">*</span></label
                >
                <input
                  class="field__input"
                  type="text"
                  placeholder="Village or city"
                  [(ngModel)]="form.village"
                  name="village"
                  [class.is-invalid]="submitted && !form.village"
                />
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- ── Right column ────────────────────────────────── -->
      <div class="col-side">
        <!-- Product -->
        <div class="card">
          <div class="card__accent"></div>
          <h3 class="card__title">Product</h3>
          <div class="card__body">
            <div class="field">
              <label class="field__label">SERIAL NUMBER</label>
              <input
                class="field__input field__input--readonly"
                type="text"
                [value]="form.productSerialNumber"
                readonly
              />
            </div>
          </div>
        </div>

        <!-- Payment -->
        <div class="card">
          <div class="card__accent"></div>
          <h3 class="card__title">Payment Details</h3>
          <div class="card__body">
            <div class="field">
              <label class="field__label"
                >ADVANCE PAYMENT <span class="required">*</span></label
              >
              <div class="currency-field">
                <span class="currency-symbol">₹</span>
                <input
                  class="field__input field__input--currency"
                  type="number"
                  min="0"
                  placeholder="0"
                  [(ngModel)]="form.advancePayment"
                  name="advancePayment"
                  [class.is-invalid]="submitted && form.advancePayment === null"
                />
              </div>
            </div>
            <div class="field">
              <label class="field__label"
                >REMAINING PAYMENT <span class="required">*</span></label
              >
              <div class="currency-field">
                <span class="currency-symbol">₹</span>
                <input
                  class="field__input field__input--currency"
                  type="number"
                  min="0"
                  placeholder="0"
                  [(ngModel)]="form.remainingPayment"
                  name="remainingPayment"
                  [class.is-invalid]="
                    submitted && form.remainingPayment === null
                  "
                />
              </div>
            </div>
          </div>
        </div>

        <!-- Status -->
        <div class="card">
          <div class="card__accent"></div>
          <h3 class="card__title">Booking Status</h3>
          <div class="card__body">
            <div class="field">
              <label class="field__label">STATUS</label>
              <app-custom-select
                [(ngModel)]="form.status"
                name="status"
                [options]="statusOptions"
              />
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer actions -->
    <div class="form-footer">
      <button type="button" class="btn-cancel" (click)="goBack()">
        Cancel
      </button>
      <button
        type="button"
        class="btn-save"
        [disabled]="saving"
        (click)="onSubmit()"
      >
        @if (saving) {
          <span class="material-symbols-outlined spinning"
            >progress_activity</span
          >
          Saving…
        } @else {
          <span class="material-symbols-outlined">save</span>
          Save Changes
        }
      </button>
    </div>
  }
</div>
